<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hybrid Calculator</title>
    <link rel="icon" type="image/svg+xml" href="hybrid-calculator-icon.svg" />
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body class="theme1">
    <div class="calculator-container">
        <div class="top-bar">
            <h2>Calculator</h2>
            <div class="top-bar-actions">
                <button id="sound-btn" class="icon-btn" title="Toggle sound" aria-label="Toggle sound"><i class="fas fa-volume-high"></i></button>
                <button id="history-btn" class="icon-btn" title="History" aria-label="Open history"><i class="fas fa-clock-rotate-left"></i></button>
                <button id="theme-btn">Change Theme</button>
            </div>
        </div>

        <div class="mode-tabs" role="tablist" aria-label="Calculator modes">
            <button class="mode-btn active" data-mode="standard" type="button" role="tab" aria-selected="true">Standard</button>
            <button class="mode-btn" data-mode="scientific" type="button" role="tab" aria-selected="false">Scientific</button>
            <button class="mode-btn" data-mode="converter" type="button" role="tab" aria-selected="false">Converter</button>
        </div>

        <div class="display-container">
            <span id="memory-indicator" class="memory-indicator">M</span>
            <button id="copy-btn" class="icon-btn copy-btn" title="Copy result" aria-label="Copy result"><i class="fas fa-copy"></i></button>
            <div id="expression">0</div>
            <div id="result">—</div>
        </div>

        <div class="keypad">
            <div class="keys mem-row" role="group" aria-label="Memory keys">
                <button class="btn btn-mem" data-mem="mc">MC</button>
                <button class="btn btn-mem" data-mem="mr">MR</button>
                <button class="btn btn-mem" data-mem="mplus">M+</button>
                <button class="btn btn-mem" data-mem="mminus">M−</button>
                <button class="btn btn-mem" data-mem="ms">MS</button>
            </div>

            <div class="keys sci-row" role="group" aria-label="Scientific keys">
                <button class="btn btn-sci" id="angle-toggle" data-action="deg-rad">DEG</button>
                <button class="btn btn-sci" data-func="sin">sin</button>
                <button class="btn btn-sci" data-func="cos">cos</button>
                <button class="btn btn-sci" data-func="tan">tan</button>
                <button class="btn btn-sci" data-func="log">log</button>
                <button class="btn btn-sci" data-func="ln">ln</button>
                <button class="btn btn-sci" data-func="sqrt">√</button>
                <button class="btn btn-sci" data-value="^" data-key="^">x^y</button>
                <button class="btn btn-sci" data-instant="square">x²</button>
                <button class="btn btn-sci" data-instant="reciprocal">1/x</button>
                <button class="btn btn-sci" data-instant="factorial">n!</button>
                <button class="btn btn-sci" data-const="pi">π</button>
                <button class="btn btn-sci" data-const="e">e</button>
            </div>

            <div class="keys main-keys" role="group" aria-label="Calculator keys">
                <button class="btn btn-func" data-action="clear" data-key="Escape">AC</button>
                <button class="btn btn-func" data-action="parentheses" data-key="(">( )</button>
                <button class="btn btn-func" data-value="%" data-key="%">%</button>
                <button class="btn btn-op" data-value="/" data-key="/">÷</button>

                <button class="btn" data-value="7" data-key="7">7</button>
                <button class="btn" data-value="8" data-key="8">8</button>
                <button class="btn" data-value="9" data-key="9">9</button>
                <button class="btn btn-op" data-value="*" data-key="*">×</button>

                <button class="btn" data-value="4" data-key="4">4</button>
                <button class="btn" data-value="5" data-key="5">5</button>
                <button class="btn" data-value="6" data-key="6">6</button>
                <button class="btn btn-op" data-value="-" data-key="-">—</button>

                <button class="btn" data-value="1" data-key="1">1</button>
                <button class="btn" data-value="2" data-key="2">2</button>
                <button class="btn" data-value="3" data-key="3">3</button>
                <button class="btn btn-op" data-value="+" data-key="+">+</button>

                <button class="btn zero" data-value="0" data-key="0">0</button>
                <button class="btn" data-value="." data-key=".">.</button>
                <button class="btn btn-func" data-action="backspace" data-key="Backspace"><i class="fas fa-backspace"></i></button>
                <button class="btn btn-eq" data-action="equals" data-key="Enter">=</button>
            </div>

            <div class="converter-panel">
                <div class="converter-row">
                    <label for="conv-category">Category</label>
                    <select id="conv-category">
                        <option value="length">Length</option>
                        <option value="weight">Weight</option>
                        <option value="temperature">Temperature</option>
                    </select>
                </div>
                <div class="converter-row converter-inputs">
                    <input type="number" id="conv-input" value="1" step="any" aria-label="Value to convert" />
                    <select id="conv-from" aria-label="From unit"></select>
                </div>
                <button id="conv-swap" class="icon-btn conv-swap" type="button" title="Swap units" aria-label="Swap units"><i class="fas fa-right-left"></i></button>
                <div class="converter-row converter-inputs">
                    <div id="conv-output" class="converter-output">0</div>
                    <select id="conv-to" aria-label="To unit"></select>
                </div>
            </div>
        </div>

        <div class="footer-section">
           <div class="social-icons">
                <a href="mailto:nouramaher100@gmail.com" class="icon-link"><i class="fas fa-envelope"></i></a>
                <a href="https://www.linkedin.com/in/nouramaherelamin/" class="icon-link"><i class="fab fa-linkedin-in"></i></a>
                <a href="https://github.com/nouramaherelamin" class="icon-link"><i class="fab fa-github"></i></a>
                <a href="https://www.youtube.com/@nouram.w" class="icon-link"><i class="fab fa-youtube"></i></a>
            </div>
            <p>© Noura Maher - All Rights Reserved</p>
        </div>
    </div>

    <div id="history-overlay" class="history-overlay"></div>
    <aside id="history-panel" class="history-panel" aria-label="Calculation history">
        <div class="history-header">
            <h3>History</h3>
            <div class="history-header-actions">
                <button id="history-clear" class="icon-btn" title="Clear history" aria-label="Clear history"><i class="fas fa-trash"></i></button>
                <button id="history-close" class="icon-btn" title="Close" aria-label="Close history"><i class="fas fa-xmark"></i></button>
            </div>
        </div>
        <ul id="history-list" class="history-list"></ul>
    </aside>

    <div id="toast" class="toast"></div>
</body>

</html>
